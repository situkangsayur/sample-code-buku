# Kode 3.9: nginx (1.25.1+) sebagai reverse proxy dan load balancer L7.
# Uji sintaks: nginx -t -c $(pwd)/nginx.conf
events {}
http {
    upstream katalog {
        least_conn;                                   # ke koneksi aktif tersedikit
        server 10.0.0.11:8080 max_fails=3 fail_timeout=10s;
        server 10.0.0.12:8080 max_fails=3 fail_timeout=10s;
        server 10.0.0.13:8080 backup;                 # dipakai bila lainnya mati
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name toko.contoh.id;
        ssl_certificate     /etc/ssl/toko.pem;
        ssl_certificate_key /etc/ssl/toko-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location /api/ {
            proxy_pass http://katalog;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;                    # jangan menunggu selamanya
        }
    }
}
