pekko {
  loglevel = "INFO"
  actor {
    provider = cluster
    serialization-bindings {
      "bab13.CborSerializable" = jackson-cbor
    }
  }
  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 25520            # ditimpa oleh argumen program
  }
  cluster {
    seed-nodes = ["pekko://BankKlaster@127.0.0.1:25520"]
    # Split brain resolver: saat jaringan terbelah, sisi minoritas mematikan dirinya
    # agar tidak ada dua salinan entity yang sama.
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver.active-strategy = keep-majority
    sharding.passivation.strategy = default-strategy
  }
}
