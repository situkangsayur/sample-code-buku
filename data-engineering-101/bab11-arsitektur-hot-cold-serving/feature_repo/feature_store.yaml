# Konfigurasi Feast lokal untuk latihan. Untuk Redis/Valkey sebagai online store:
# online_store:
#   type: redis
#   connection_string: "localhost:6379"
project: bank_syariah
registry: data/registry.db
provider: local
online_store:
  type: sqlite
  path: data/online_store.db
offline_store:
  type: file
entity_key_serialization_version: 3
